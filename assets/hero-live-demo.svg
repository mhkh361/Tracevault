<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="20%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Emerald Button Gradient -->
    <linearGradient id="btnEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Ambient Mesh Orbs -->
    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGlow2" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Window Container Frame -->
  <rect x="6" y="6" width="908" height="488" rx="16" fill="url(#heroBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />
  
  <!-- Ambient Mesh Glow Orbs -->
  <circle cx="180" cy="160" r="160" fill="url(#meshGlow1)" />
  <circle cx="740" cy="320" r="200" fill="url(#meshGlow2)" />

  <!-- Window Chrome Header -->
  <path d="M6 22 C6 13.16 13.16 6 22 6 L898 6 C906.84 6 914 13.16 914 22 L914 52 L6 52 Z" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Mac Window Dots -->
  <circle cx="30" cy="29" r="5" fill="#ef4444" />
  <circle cx="48" cy="29" r="5" fill="#f59e0b" />
  <circle cx="66" cy="29" r="5" fill="#10b981" />

  <!-- Browser Address URL Pill -->
  <rect x="260" y="18" width="370" height="24" rx="6" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
  <text x="375" y="34" font-family="monospace" font-size="11" fill="#94a3b8">https://tracevault.cloud/workspace</text>

  <!-- Right Status Badges (Cloud Active and Universal AI) -->
  <g transform="translate(680, 18)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Cloud Status -->
    <rect x="0" y="0" width="112" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="16" font-size="10" font-weight="700" fill="#a7f3d0">Cloud Active</text>

    <!-- AI Status -->
    <rect x="120" y="0" width="102" height="24" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
    <circle cx="132" cy="12" r="3.5" fill="#06b6d4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="142" y="16" font-size="10" font-weight="700" fill="#38bdf8">&#128273; AI Active</text>
  </g>

  <!-- ================= TOP KPI SUMMARY STRIP ================= -->
  <g transform="translate(30, 68)" font-family="system-ui, -apple-system, sans-serif">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="200" height="56" rx="10" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="14" y="22" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">TOTAL TRACKED BUGS</text>
    <text x="14" y="46" font-size="22" font-weight="900" fill="#f8fafc">42</text>
    <text x="145" y="42" font-family="monospace" font-size="10" fill="#34d399">COUNT()</text>

    <!-- KPI 2 -->
    <rect x="220" y="0" width="200" height="56" rx="10" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="234" y="22" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">AVG OCCURRENCES</text>
    <text x="234" y="46" font-size="22" font-weight="900" fill="#38bdf8">4.8</text>
    <text x="368" y="42" font-family="monospace" font-size="10" fill="#38bdf8">AVG()</text>

    <!-- KPI 3 -->
    <rect x="440" y="0" width="200" height="56" rx="10" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="454" y="22" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">DEDUPLICATION</text>
    <text x="454" y="46" font-size="22" font-weight="900" fill="#a78bfa">100%</text>
    <text x="575" y="42" font-family="monospace" font-size="10" fill="#a78bfa">SHA-256</text>

    <!-- KPI 4 -->
    <rect x="660" y="0" width="200" height="56" rx="10" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="674" y="22" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">ROUTER LATENCY</text>
    <text x="674" y="46" font-size="22" font-weight="900" fill="#fbbf24">7 ms</text>
    <text x="806" y="42" font-family="monospace" font-size="10" fill="#fbbf24">FAST</text>
  </g>

  <!-- ================= MAIN TWO-PANEL WORKSPACE ================= -->

  <!-- PANEL A: AI MEMORY SCANNER (LEFT) -->
  <g transform="translate(30, 138)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Panel Body -->
    <rect x="0" y="0" width="420" height="336" rx="14" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Panel Header -->
    <text x="18" y="28" font-size="12" font-weight="800" fill="#e2e8f0" letter-spacing="0.04em">PANEL A: AI MEMORY SCANNER</text>
    <rect x="315" y="14" width="88" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <text x="327" y="28" font-size="9.5" font-weight="700" fill="#38bdf8">SCAN READY</text>

    <!-- Code Input Box -->
    <rect x="16" y="46" width="388" height="136" rx="8" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    
    <!-- Code Stack Trace -->
    <g font-family="monospace" font-size="10.5">
      <text x="28" y="72" fill="#ef4444">TypeError: Cannot read properties of undefined (reading 'map')</text>
      <text x="28" y="92" fill="#94a3b8">  at UserList.render (<tspan fill="#38bdf8">UserList.tsx:24:19</tspan>)</text>
      <text x="28" y="112" fill="#64748b">  at react-dom.production.min.js:184:320</text>
      <text x="28" y="132" fill="#64748b">  at performUnitOfWork (react-dom:223)</text>
      <text x="28" y="152" fill="#64748b">  at workLoopSync (react-dom:198)</text>
    </g>

    <!-- ANIMATED SCANNING LASER BEAM (SMIL animate element) -->
    <rect x="16" y="55" width="388" height="3" fill="url(#laserBeamGrad)">
      <animate attributeName="y" values="55;165;55" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Action Button -->
    <rect x="16" y="196" width="388" height="34" rx="8" fill="url(#btnEmerald)" />
    <text x="145" y="218" font-size="12" font-weight="700" fill="#000000">&#9889; Scan Broken Code</text>

    <!-- Match Result Box -->
    <rect x="16" y="242" width="388" height="78" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="34" cy="262" r="5" fill="#10b981" />
    <text x="46" y="266" font-size="11" font-weight="700" fill="#a7f3d0">Memory Hit: Exact Signature Found in Vault</text>
    <text x="28" y="286" font-family="monospace" font-size="10" fill="#94a3b8">SHA: 54bd8abe4141... (Times Hit: 14 &#8226; Verified: Yes)</text>
    <text x="28" y="304" font-size="10.5" fill="#38bdf8">&#8594; Bypassed API cost. Served in 0.8ms from memory.</text>
  </g>

  <!-- PANEL B: CONTEXT-AWARE DEBUG BOT (RIGHT) -->
  <g transform="translate(470, 138)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Panel Body -->
    <rect x="0" y="0" width="420" height="336" rx="14" fill="url(#glassCard)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Panel Header -->
    <text x="18" y="28" font-size="12" font-weight="800" fill="#e2e8f0" letter-spacing="0.04em">PANEL B: CONTEXT-AWARE DEBUG BOT</text>
    <circle cx="395" cy="24" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- User Chat Bubble -->
    <g transform="translate(16, 46)">
      <rect x="42" y="0" width="346" height="32" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="56" y="20" font-size="11" fill="#f1f5f9">How do I prevent this crash when items is loading?</text>
      <rect x="8" y="4" width="24" height="24" rx="12" fill="rgba(255, 255, 255, 0.15)" />
      <text x="14" y="20" font-size="11">&#128100;</text>
    </g>

    <!-- Bot Response Bubble -->
    <g transform="translate(16, 90)">
      <rect x="0" y="0" width="388" height="188" rx="10" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      
      <!-- Bot Avatar -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="#06b6d4" />
        <text x="5" y="16" font-size="11" font-weight="900" fill="#000000">AI</text>
      </g>
      <text x="42" y="28" font-size="11.5" font-weight="700" fill="#38bdf8">TraceVault Debug Assistant</text>

      <!-- Explanation -->
      <text x="16" y="55" font-size="10.5" fill="#cbd5e1">
        Root cause: State is accessed prior to async data return.
      </text>

      <!-- Code Patch -->
      <rect x="16" y="68" width="356" height="68" rx="6" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="26" y="88" font-family="monospace" font-size="10" fill="#34d399">// Recommended 2-step patch:</text>
      <text x="26" y="104" font-family="monospace" font-size="10" fill="#f8fafc">const [items, setItems] = useState([]);</text>
      <text x="26" y="122" font-family="monospace" font-size="10" fill="#38bdf8">(items || []).map(item =&gt; &lt;Row key={item.id} /&gt;)</text>

      <!-- Animated Progress Bar -->
      <rect x="16" y="146" width="356" height="4" rx="2" fill="rgba(255, 255, 255, 0.1)" />
      <rect x="16" y="146" height="4" rx="2" fill="#10b981">
        <animate attributeName="width" values="40;356;356" dur="3s" repeatCount="indefinite" />
      </rect>

      <!-- Badge -->
      <rect x="16" y="158" width="138" height="20" rx="5" fill="rgba(16, 185, 129, 0.18)" />
      <text x="24" y="172" font-size="9.5" font-weight="700" fill="#6ee7b7">&#10003; Memory Verified Fix</text>
    </g>

    <!-- Chat Input Box -->
    <rect x="16" y="290" width="388" height="34" rx="8" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="30" y="311" font-size="11" fill="#64748b">Ask follow-up question or request unit test...</text>
  </g>
</svg>
