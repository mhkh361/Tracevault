<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" fill="none">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="browserBg" x1="0" y1="0" x2="900" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Frosted Glass Surface Gradients -->
    <linearGradient id="glassSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="meshOrb1" cx="200" cy="150" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshOrb2" cx="700" cy="300" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes laserSweep {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(68px); opacity: 1; }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 0.7; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes typeResponse {
      0% { opacity: 0; transform: translateY(6px); }
      20% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 1; }
    }
    @keyframes hitCounterPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .laser-line {
      animation: laserSweep 3s ease-in-out infinite;
    }
    .live-dot {
      animation: pulseLive 2s ease-in-out infinite;
    }
    .typing-card {
      animation: typeResponse 6s ease-in-out infinite;
    }
    .hit-number {
      animation: hitCounterPulse 2.5s ease-in-out infinite;
    }
    .ui-font {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .mono-font {
      font-family: 'JetBrains Mono', Consolas, 'Fira Code', monospace;
    }
  </style>

  <!-- Outer Window Shadow & Background -->
  <rect x="10" y="10" width="880" height="460" rx="16" fill="url(#browserBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  
  <!-- Mesh Refraction Orbs -->
  <circle cx="200" cy="150" r="180" fill="url(#meshOrb1)" />
  <circle cx="700" cy="300" r="220" fill="url(#meshOrb2)" />

  <!-- Window Header / Chrome Bar -->
  <path d="M10 26 C10 17.16 17.16 10 26 10 L874 10 C882.84 10 890 17.16 890 26 L890 52 L10 52 Z" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  
  <!-- Mac Window Controls -->
  <circle cx="34" cy="31" r="5.5" fill="#ef4444" />
  <circle cx="52" cy="31" r="5.5" fill="#f59e0b" />
  <circle cx="70" cy="31" r="5.5" fill="#10b981" />

  <!-- Browser Address URL Pill -->
  <rect x="250" y="20" width="360" height="22" rx="6" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <text x="380" y="35" class="mono-font" font-size="10.5" fill="#94a3b8">https://tracevault.cloud/workspace</text>

  <!-- Right Status Badges (Cloud Sync + Universal AI) -->
  <g transform="translate(680, 20)">
    <rect x="0" y="0" width="105" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#10b981" class="live-dot" filter="url(#neonBlur)" />
    <text x="18" y="15" class="ui-font" font-size="9.5" font-weight="700" fill="#a7f3d0">Cloud Active</text>

    <rect x="112" y="0" width="88" height="22" rx="11" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
    <text x="120" y="15" class="ui-font" font-size="9.5" font-weight="700" fill="#38bdf8">🔑 AI Active</text>
  </g>

  <!-- ================= TOP KPI SUMMARY STRIP ================= -->
  <g transform="translate(30, 66)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="195" height="52" rx="10" fill="url(#glassSurface)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="14" y="20" class="ui-font" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">TOTAL TRACKED BUGS</text>
    <text x="14" y="42" class="ui-font hit-number" font-size="20" font-weight="900" fill="#f8fafc">42</text>
    <text x="140" y="38" class="mono-font" font-size="10" fill="#34d399">COUNT()</text>

    <!-- KPI 2 -->
    <rect x="215" y="0" width="195" height="52" rx="10" fill="url(#glassSurface)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="229" y="20" class="ui-font" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">AVG OCCURRENCES</text>
    <text x="229" y="42" class="ui-font" font-size="20" font-weight="900" fill="#38bdf8">4.8</text>
    <text x="355" y="38" class="mono-font" font-size="10" fill="#38bdf8">AVG()</text>

    <!-- KPI 3 -->
    <rect x="430" y="0" width="195" height="52" rx="10" fill="url(#glassSurface)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="444" y="20" class="ui-font" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">DEDUPLICATION</text>
    <text x="444" y="42" class="ui-font" font-size="20" font-weight="900" fill="#a78bfa">100%</text>
    <text x="565" y="38" class="mono-font" font-size="10" fill="#a78bfa">SHA-256</text>

    <!-- KPI 4 -->
    <rect x="645" y="0" width="195" height="52" rx="10" fill="url(#glassSurface)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="659" y="20" class="ui-font" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="0.05em">ROUTER LATENCY</text>
    <text x="659" y="42" class="ui-font" font-size="20" font-weight="900" fill="#fbbf24">7 ms</text>
    <text x="785" y="38" class="mono-font" font-size="10" fill="#fbbf24">FAST</text>
  </g>

  <!-- ================= MAIN TWO-PANEL WORKSPACE ================= -->
  
  <!-- PANEL A: AI ERROR SCANNER (LEFT) -->
  <g transform="translate(30, 130)">
    <!-- Panel Background -->
    <rect x="0" y="0" width="400" height="320" rx="14" fill="url(#glassSurface)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Panel Header -->
    <text x="18" y="28" class="ui-font" font-size="12" font-weight="800" fill="#e2e8f0" letter-spacing="0.04em">PANEL A: AI MEMORY SCANNER</text>
    <rect x="300" y="14" width="85" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <text x="312" y="28" class="ui-font" font-size="9.5" font-weight="700" fill="#38bdf8">SCAN READY</text>

    <!-- Code Input Box -->
    <rect x="16" y="46" width="368" height="130" rx="8" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    
    <!-- Code Text -->
    <g class="mono-font" font-size="10.5" fill="#e2e8f0">
      <text x="28" y="70" fill="#ef4444">TypeError: Cannot read properties of undefined (reading 'map')</text>
      <text x="28" y="90" fill="#94a3b8">  at UserList.render (<tspan fill="#38bdf8">UserList.tsx:24:19</tspan>)</text>
      <text x="28" y="110" fill="#64748b">  at react-dom.production.min.js:184:320</text>
      <text x="28" y="130" fill="#64748b">  at performUnitOfWork (react-dom:223)</text>
      <text x="28" y="150" fill="#64748b">  at workLoopSync (react-dom:198)</text>
    </g>

    <!-- ANIMATED SCANNING LASER BEAM -->
    <g class="laser-line">
      <line x1="16" y1="75" x2="384" y2="75" stroke="url(#laserGrad)" stroke-width="3" filter="url(#neonBlur)" />
      <line x1="16" y1="75" x2="384" y2="75" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
    </g>

    <!-- Scan Trigger Action -->
    <rect x="16" y="190" width="368" height="34" rx="8" fill="url(#accentEmerald)" />
    <text x="145" y="212" class="ui-font" font-size="12" font-weight="700" fill="#000000">⚡ Scan Broken Code</text>

    <!-- Match Notification Box -->
    <rect x="16" y="238" width="368" height="66" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="34" cy="256" r="5" fill="#10b981" />
    <text x="46" y="260" class="ui-font" font-size="11" font-weight="700" fill="#a7f3d0">Memory Hit: Exact Signature Found in Vault</text>
    <text x="28" y="280" class="mono-font" font-size="10" fill="#94a3b8">SHA: 54bd8abe4141... (Times Hit: 14 &bull; Verified: Yes)</text>
    <text x="28" y="296" class="ui-font" font-size="10" fill="#38bdf8">&rarr; Bypassed API cost. Served in 0.8ms from memory.</text>
  </g>

  <!-- PANEL B: CONTEXT-AWARE DEBUG BOT (RIGHT) -->
  <g transform="translate(450, 130)">
    <!-- Panel Background -->
    <rect x="0" y="0" width="420" height="320" rx="14" fill="url(#glassSurface)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Panel Header -->
    <text x="18" y="28" class="ui-font" font-size="12" font-weight="800" fill="#e2e8f0" letter-spacing="0.04em">PANEL B: CONTEXT-AWARE DEBUG BOT</text>
    <circle cx="395" cy="24" r="4" fill="#10b981" class="live-dot" />

    <!-- User Chat Bubble -->
    <g transform="translate(16, 44)">
      <rect x="50" y="0" width="338" height="32" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="64" y="20" class="ui-font" font-size="11" fill="#f1f5f9">How do I prevent this crash when items is still loading?</text>
      <rect x="12" y="4" width="24" height="24" rx="12" fill="rgba(255, 255, 255, 0.15)" />
      <text x="19" y="20" class="ui-font" font-size="11">👤</text>
    </g>

    <!-- Bot Response Bubble (Animated Fade/Type) -->
    <g class="typing-card" transform="translate(16, 88)">
      <rect x="0" y="0" width="388" height="175" rx="10" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      
      <!-- Bot Avatar Mini Glass Cube -->
      <g transform="translate(12, 12)">
        <rect x="0" y="0" width="22" height="22" rx="6" fill="#06b6d4" />
        <text x="5" y="16" class="ui-font" font-size="11" font-weight="900" fill="#000000">AI</text>
      </g>
      <text x="42" y="28" class="ui-font" font-size="11.5" font-weight="700" fill="#38bdf8">TraceVault Debug Assistant</text>

      <!-- Bot Explanation -->
      <text x="16" y="55" class="ui-font" font-size="10.5" fill="#cbd5e1">
        Root cause: State is accessed prior to async data return.
      </text>

      <!-- Code Patch -->
      <rect x="16" y="68" width="356" height="66" rx="6" fill="rgba(0, 0, 0, 0.7)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="26" y="88" class="mono-font" font-size="10" fill="#34d399">// Recommended 2-step patch:</text>
      <text x="26" y="104" class="mono-font" font-size="10" fill="#f8fafc">const [items, setItems] = useState([]);</text>
      <text x="26" y="120" class="mono-font" font-size="10" fill="#38bdf8">(items || []).map(item =&gt; &lt;Row key={item.id} /&gt;)</text>

      <!-- Verification Badge -->
      <rect x="16" y="142" width="138" height="22" rx="6" fill="rgba(16, 185, 129, 0.18)" />
      <text x="24" y="157" class="ui-font" font-size="9.5" font-weight="700" fill="#6ee7b7">✓ Memory Verified Fix</text>
    </g>

    <!-- Chat Input Box -->
    <rect x="16" y="274" width="388" height="34" rx="8" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="30" y="295" class="ui-font" font-size="11" fill="#64748b">Ask follow-up question or request unit test...</text>
  </g>
</svg>
