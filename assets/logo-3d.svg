<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1026" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Glass Facet Gradients -->
    <linearGradient id="cubeGlassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="cubeGlassLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0a1024" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="cubeGlassRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#060913" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25" />
    </linearGradient>

    <!-- Core Gradients -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <radialGradient id="haloCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Frame with Specular Glass Border -->
  <rect x="10" y="10" width="900" height="200" rx="22" fill="url(#logoBg)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />
  <rect x="10" y="10" width="900" height="200" rx="22" fill="none" stroke="url(#titleGrad)" stroke-width="1" stroke-opacity="0.35" />

  <!-- Ambient Light Orbs Centered at (115, 110) -->
  <circle cx="115" cy="110" r="75" fill="url(#haloCyan)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- ================= LEFT: 3D ISOMETRIC GLASS CUBE (CENTER: 115, 110, SCALE: 0.78) ================= -->
  <g transform="translate(115, 110)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,-5; 0,5; 0,-5" dur="3.5s" repeatCount="indefinite" />
      <g transform="scale(0.78) translate(-110, -106)">
        <!-- Back Wireframe (Isometric Depth) -->
        <path d="M110 32 L46 68 L46 142 L110 106 Z" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5" stroke-dasharray="4,3" />
        <path d="M110 32 L174 68 L174 142 L110 106 Z" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" stroke-dasharray="4,3" />
        <path d="M110 106 L46 142 L110 178 L174 142 Z" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4,3" />

        <!-- Pulsing Inner Quantum Core -->
        <g id="pulsingCore">
          <path d="M110 76 L135 91 L110 106 L85 91 Z" fill="#38bdf8" stroke="rgba(255, 255, 255, 0.9)" stroke-width="1.5" />
          <path d="M85 91 L110 106 L110 136 L85 121 Z" fill="#06b6d4" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5" />
          <path d="M110 106 L135 91 L135 121 L110 136 Z" fill="#10b981" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5" />
          <circle cx="110" cy="106" r="6" fill="#ffffff">
            <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite" />
          </circle>
        </g>

        <!-- Orbital Energy Rings -->
        <ellipse cx="110" cy="106" rx="48" ry="24" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" />
        </ellipse>

        <!-- Outer Translucent Frosted Glass Faces -->
        <path d="M46 68 L110 106 L110 178 L46 142 Z" fill="url(#cubeGlassLeft)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
        <path d="M110 106 L174 68 L174 142 L110 178 Z" fill="url(#cubeGlassRight)" stroke="rgba(255, 255, 255, 0.28)" stroke-width="2" />
        <path d="M110 32 L174 68 L110 106 L46 68 Z" fill="url(#cubeGlassTop)" stroke="rgba(255, 255, 255, 0.55)" stroke-width="2.5" />

        <!-- Specular Highlight Bevels -->
        <path d="M110 32 L46 68 L110 106" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95" />
        <path d="M110 32 L174 68" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
        <path d="M110 106 L110 178" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2.5" stroke-linecap="round" />

        <!-- Glass Nodes -->
        <circle cx="110" cy="32" r="3.5" fill="#ffffff" />
        <circle cx="46" cy="68" r="3" fill="#06b6d4" />
        <circle cx="174" cy="68" r="3" fill="#10b981" />
        <circle cx="110" cy="178" r="3" fill="#a78bfa" />
        <circle cx="110" cy="106" r="4" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- ================= RIGHT: BRANDING TYPOGRAPHY AND PILLS (INWARD AT x=215, ENDS < 860) ================= -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Version Tag -->
    <rect x="215" y="32" width="138" height="22" rx="11" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="227" cy="43" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="237" y="47" fill="#6ee7b7" font-size="10.5" font-weight="700" letter-spacing="0.08em">PRODUCTION CLOUD</text>

    <!-- App Title with Gradient -->
    <text x="215" y="96" font-size="44" font-weight="900" letter-spacing="-0.03em" fill="url(#titleGrad)">TraceVault</text>

    <!-- Subtitle -->
    <text x="215" y="124" font-size="13.5" font-weight="500" fill="#94a3b8" letter-spacing="-0.01em">
      Self-Learning AI Debug Bot &amp; Cloud-Native Error Knowledge Base
    </text>

    <!-- Feature Pills (Clean 2 Badges) -->
    <g transform="translate(215, 140)">
      <!-- Pill 1: Live Web App -->
      <rect x="0" y="0" width="160" height="26" rx="7" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <text x="14" y="17" fill="#34d399" font-size="10.5" font-weight="600">&#127760; Live Web App</text>

      <!-- Pill 2: MIT License -->
      <rect x="172" y="0" width="140" height="26" rx="7" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <text x="186" y="17" fill="#38bdf8" font-size="10.5" font-weight="600">&#9878; MIT License</text>
    </g>

    <!-- Bottom Metric String -->
    <text x="215" y="190" font-family="monospace" font-size="11" fill="#64748b">
      SHA-256 Deduplication &#8226; 3NF Relational Architecture &#8226; Zero Dependencies First
    </text>
  </g>
</svg>